<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050c1a">
  <title>Kullanıcı Paneli | TEHAŞ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:       #050c1a;
      --bg-1:     #091422;
      --bg-2:     #0d1c30;
      --line:     #162336;
      --line-2:   #1e3050;
      --t-1:      #eaf0ff;
      --t-2:      #7c9cbf;
      --t-3:      #3f5a7a;
      --t-4:      #253548;

      --blue:     #3b82f6;
      --blue-dim: rgba(59, 130, 246, .10);
      --cyan:     #34d399;
      --cyan-dim: rgba(52, 211, 153, .10);
      --violet:   #a78bfa;

      --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --head: 'Syne', system-ui, sans-serif;

      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --ease:   cubic-bezier(.22, .8, .2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(167, 139, 250, .10), transparent 55%),
        radial-gradient(ellipse 50% 40% at 15% 90%,  rgba(52, 211, 153, .06),  transparent 50%),
        var(--bg);
      color: var(--t-1);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);
    }

    /* Grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59, 130, 246, .02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, .02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── Card ────────────────────────────────────── */
    .card {
      position: relative;
      max-width: 380px;
      width: 100%;
      text-align: center;
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 28px;
      overflow: hidden;
    }

    /* Subtle top glow inside card */
    .card::before {
      content: '';
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 80px;
      background: radial-gradient(ellipse, rgba(167, 139, 250, .12), transparent 70%);
      pointer-events: none;
    }

    /* ─── Icon mark ───────────────────────────────── */
    .mark {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      background: rgba(167, 139, 250, .07);
      border: 1px solid rgba(167, 139, 250, .25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      position: relative;
    }

    .mark svg {
      width: 26px;
      height: 26px;
      color: var(--violet);
    }

    /* ─── Badge ───────────────────────────────────── */
    .badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .22em;
      color: var(--violet);
      text-transform: uppercase;
      background: rgba(167, 139, 250, .07);
      border: 1px solid rgba(167, 139, 250, .2);
      padding: 5px 13px;
      border-radius: 99px;
      margin-bottom: 16px;
    }

    /* ─── Heading ─────────────────────────────────── */
    h1 {
      font-family: var(--head);
      font-weight: 700;
      font-size: 24px;
      color: var(--t-1);
      letter-spacing: -.01em;
      margin-bottom: 10px;
    }

    /* ─── Body text ───────────────────────────────── */
    .desc {
      font-size: 12px;
      color: var(--t-2);
      line-height: 1.7;
      letter-spacing: .02em;
      margin-bottom: 28px;
    }

    /* ─── Feature list ────────────────────────────── */
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 28px;
      text-align: left;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 13px;
      background: rgba(255, 255, 255, .02);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 12px;
      color: var(--t-2);
      letter-spacing: .02em;
      transition: border-color .2s, background .2s;
    }

    .item-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      background: rgba(167, 139, 250, .07);
      border: 1px solid rgba(167, 139, 250, .25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--violet);
      font-size: 8px;
    }

    /* ─── Divider ─────────────────────────────────── */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--line);
      margin: 0 auto 22px;
    }

    /* ─── Back link ───────────────────────────────── */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      background: var(--cyan);
      color: #071a12;
      border-radius: 12px;
      font-family: var(--head);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
      box-shadow: 0 8px 22px -8px rgba(52, 211, 153, .45);
      transition: opacity .15s, box-shadow .15s;
    }

    .back:active {
      opacity: .85;
      box-shadow: 0 4px 10px -4px rgba(52, 211, 153, .3);
    }

    /* ─── Footer note ─────────────────────────────── */
    .note {
      margin-top: 20px;
      font-size: 10px;
      color: var(--t-4);
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Icon -->
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
      <path d="M17 14l2 2 4-4" stroke-width="2"/>
    </svg>
  </div>

  <!-- Badge -->
  <div class="badge">FAZ-2 · Yakında</div>

  <!-- Heading -->
  <h1>Kullanıcı Paneli</h1>

  <!-- Description -->
  <p class="desc">
    Kişisel paneli geliştiriyoruz. Servis geçmişinizi,
    faturalarınızı ve randevularınızı buradan yönetebileceksiniz.
  </p>

  <!-- Feature list -->
  <div class="list">
    <div class="item"><span class="item-dot">●</span>Servis geçmişi ve takip</div>
    <div class="item"><span class="item-dot">●</span>Aktif randevular</div>
    <div class="item"><span class="item-dot">●</span>Fatura ve ödemeler</div>
    <div class="item"><span class="item-dot">●</span>Doğrudan teknisyen mesajlaşması</div>
  </div>

  <div class="divider"></div>

  <!-- CTA -->
  <a href="/" class="back">Ana Sayfaya Dön →</a>

  <!-- Note -->
  <p class="note">tehas.tr · Teknik Hizmetler A.Ş.</p>

</div>

</body>
</html>
