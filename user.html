<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>Kullanıcı Paneli | TEHAŞ</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#070b14;--bg-1:#0b1120;--line:#1c2740;--line-2:#283557;
  --t-1:#eef2f9;--t-2:#9aa6c2;--t-3:#5d6b8c;--t-4:#3a4566;
  --c-cyan:#34e5c5;--c-violet:#a78bfa;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --f-body:'Inter',-apple-system,system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;background:var(--bg);}
body{background:var(--bg);color:var(--t-1);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;}
a{color:inherit;text-decoration:none;}

.card{
  max-width:360px;width:100%;text-align:center;
  background:linear-gradient(180deg,var(--bg-1),var(--bg));
  border:1px solid var(--line);border-radius:20px;
  padding:40px 28px;
}
.card-mark{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(135deg, rgba(167,139,250,.15), rgba(52,229,197,.15));
  border:1px solid rgba(167,139,250,.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;
}
.card-mark svg{width:28px;height:28px;color:var(--c-violet);}
.card-badge{
  font-family:var(--f-mono);font-size:10px;font-weight:500;
  letter-spacing:0.2em;color:var(--c-violet);text-transform:uppercase;
  background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);
  padding:6px 14px;border-radius:99px;display:inline-block;margin-bottom:16px;
}
.card-h{font-size:22px;font-weight:600;color:#fff;letter-spacing:-0.02em;margin-bottom:10px;}
.card-p{font-size:14px;color:var(--t-2);line-height:1.6;margin-bottom:28px;}
.card-list{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;text-align:left;}
.card-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:10px;
  font-size:13px;color:var(--t-2);
}
.card-item-check{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--c-violet);font-weight:700;
}
.card-back{
  display:inline-flex;align-items:center;gap:7px;
  padding:12px 22px;background:var(--c-cyan);color:#0a1410;
  border-radius:12px;font-size:14px;font-weight:700;
  transition:opacity .15s;
}
.card-back:active{opacity:.8;}
</style>
</head>
<body>

<div class="card">
  <div class="card-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
      <path d="M17 14l2 2 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="card-badge">FAZ-2 · Yakında</div>
  <h1 class="card-h">Kullanıcı Paneli</h1>
  <p class="card-p">Kişisel kullanıcı paneli üzerinde çalışıyoruz. Yakında servis geçmişinizi, faturalarınızı ve randevularınızı buradan yönetebileceksiniz.</p>

  <div class="card-list">
    <div class="card-item"><span class="card-item-check">●</span>Servis geçmişi ve takip</div>
    <div class="card-item"><span class="card-item-check">●</span>Aktif randevular</div>
    <div class="card-item"><span class="card-item-check">●</span>Fatura ve ödemeler</div>
    <div class="card-item"><span class="card-item-check">●</span>Doğrudan teknisyen mesajlaşması</div>
  </div>

  <a href="/" class="card-back">Ana Sayfaya Dön →</a>
</div>

</body>
</html>
