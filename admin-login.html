<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TEHAŞ Admin — Giriş</title>
<style>
:root{
  --bg:#06060f;--bg-1:#0b0b1a;--bg-2:#101024;
  --line:#1a1a35;--line-2:#252545;
  --t-1:#eef0ff;--t-2:#9194b8;--t-3:#555880;--t-4:#30324e;
  --cyan:#34e5c5;--cyan-dim:rgba(52,229,197,.10);
  --red:#f87171;--green:#22c55e;
  --f-body:'Inter',-apple-system,system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{
  font-family:var(--f-body);font-size:15px;color:var(--t-1);
  background:var(--bg);min-height:100vh;display:flex;
  align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font:inherit;color:inherit;}

.box{
  width:100%;max-width:380px;padding:36px 32px;
  background:var(--bg-1);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);
}
.logo{
  width:40px;height:40px;border-radius:10px;
  border:1px solid rgba(52,229,197,.4);
  background:rgba(52,229,197,.06);
  display:flex;align-items:center;justify-content:center;
  position:relative;margin-bottom:20px;
}
.logo::before{content:'';position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(52,229,197,.6);}
.logo::after{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px rgba(52,229,197,.4);}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;}
.sub{font-size:13px;color:var(--t-3);margin-bottom:28px;}

.field{margin-bottom:14px;}
.field label{
  display:block;font-family:var(--f-mono);
  font-size:10px;font-weight:500;letter-spacing:.18em;
  color:var(--t-3);text-transform:uppercase;margin-bottom:7px;
}
.field input{
  width:100%;height:50px;padding:0 14px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
  font-size:15px;outline:none;transition:border-color .18s;
}
.field input:focus{border-color:rgba(52,229,197,.45);}
.field input::placeholder{color:var(--t-4);}

.btn{
  width:100%;height:50px;border-radius:11px;
  background:var(--cyan);color:#000;
  font-size:14px;font-weight:700;letter-spacing:.04em;
  margin-top:4px;transition:opacity .15s;
}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

.err{
  display:none;margin-bottom:14px;padding:10px 13px;
  background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.2);
  border-radius:9px;font-size:12px;color:var(--red);line-height:1.5;
}
.err.on{display:block;}
.ok{
  display:none;margin-bottom:14px;padding:10px 13px;
  background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);
  border-radius:9px;font-size:12px;color:var(--green);line-height:1.5;
}
.ok.on{display:block;}

#otpRow{display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="logo"></div>
  <h1>TEHAŞ Admin</h1>
  <p class="sub">Yönetici girişi — yalnızca yetkili kullanıcılar</p>

  <div id="errBox" class="err"></div>
  <div id="okBox"  class="ok"></div>

  <div class="field">
    <label for="phone">Telefon</label>
    <input id="phone" type="tel" inputmode="numeric" placeholder="05XX XXX XX XX" autocomplete="tel">
  </div>

  <div id="otpRow" class="field">
    <label for="otp">Doğrulama Kodu</label>
    <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6 haneli kod" autocomplete="one-time-code">
  </div>

  <button id="btn" class="btn" type="button">OTP Gönder</button>
</div>

<script>
(function(){
  const phoneEl = document.getElementById('phone');
  const otpEl   = document.getElementById('otp');
  const otpRow  = document.getElementById('otpRow');
  const btn     = document.getElementById('btn');
  const errBox  = document.getElementById('errBox');
  const okBox   = document.getElementById('okBox');
  let   otpSent = false;

  function showErr(msg){ errBox.textContent = msg; errBox.classList.add('on'); okBox.classList.remove('on'); }
  function showOk(msg) { okBox.textContent  = msg; okBox.classList.add('on');  errBox.classList.remove('on'); }
  function clearMsg()  { errBox.classList.remove('on'); okBox.classList.remove('on'); }

  // Eğer zaten token varsa admin'e yönlendir
  if(localStorage.getItem('tehas_token')) {
    window.location.replace('/admin.html');
    return;
  }

  btn.addEventListener('click', async function(){
    clearMsg();
    btn.disabled = true;

    try {
      if(!otpSent) {
        // OTP gönder
        const phone = phoneEl.value.trim();
        if(!phone){ showErr('Telefon numarası girin.'); btn.disabled=false; return; }

        const r = await fetch('/api/auth', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ action:'send', telefon: phone }),
        });
        const d = await r.json();
        if(!r.ok || d.error){ showErr(d.error || 'OTP gönderilemedi.'); btn.disabled=false; return; }

        otpSent = true;
        otpRow.style.display = 'block';
        btn.textContent = 'Giriş Yap';
        phoneEl.disabled = true;
        showOk('Doğrulama kodu gönderildi.');

      } else {
        // OTP doğrula
        const phone = phoneEl.value.trim();
        const code  = otpEl.value.trim();
        if(!code){ showErr('Kodu girin.'); btn.disabled=false; return; }

        const r = await fetch('/api/auth', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ action:'verify', telefon: phone, otp: code }),
        });
        const d = await r.json();
        if(!r.ok || d.error){ showErr(d.error || 'Doğrulama başarısız.'); btn.disabled=false; return; }

        localStorage.setItem('tehas_token', d.token);
        window.location.replace('/admin.html');
        return;
      }
    } catch(e) {
      showErr('Bağlantı hatası. Tekrar deneyin.');
    }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
